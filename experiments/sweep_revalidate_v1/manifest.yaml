  - {tag: GS_2, family: GS, base: screen, overrides: {grad_smooth_hops: 2}, assert_scalar: null, question: "Does widening density-gradient smoothing to 2 hops help over the default 1?"}
  - {tag: D_ent0, family: DENS, base: screen, overrides: {gradient_fraction: 0.6, idw_fraction: 0.4, entropy_fraction: 0.0}, assert_scalar: null, question: "Does removing the entropy-driven densification share help?"}
  - {tag: D_entonly, family: DENS, base: screen, overrides: {gradient_fraction: 0.0, idw_fraction: 0.0, entropy_fraction: 1.0}, assert_scalar: null, question: "Does an entropy-only densification budget help?"}
  - {tag: D_gradheavy, family: DENS, base: screen, overrides: {gradient_fraction: 0.8, idw_fraction: 0.2, entropy_fraction: 0.0}, assert_scalar: null, question: "Does a gradient-heavy densification budget help?"}
