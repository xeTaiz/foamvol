stages:
  A: "5 replicates of the unmodified 256k baseline (BASE_s42..46) -> sigma_psnr, sigma_chamfer, and REF_NPY = output/sweep_revalidate/BASE_s42/volume_hard_ss4.npy."
  B: "50 screen arms (all families above except SMOKE), one replicate each, base 256k unless family is CELLS."
  C: "For every Stage-B arm that passes the decision rule, 3 more replicates (seed 43/44/45)."
