name: sweep_revalidate_v1
tensorboard_prefix: sweep_revalidate/

purpose: >
  specs/VOXEL-GRID-CONVENTION-v1.md fixed a repo-wide voxel-grid registration
  bug: endpoint linspace(-extent,extent,R) grids -> voxel centres,
  align_corners=True -> False. Volume metrics were biased ~1.7 dB by
  misregistration plus ~2.1 dB by 1-sample quadrature, and the bias is
  arm-dependent (0.21 dB spread), so it can reorder any comparison whose
  margin is under ~0.25 dB. This sweep re-tests every plausible prior idea
  under the corrected evaluator with a measured noise floor.

base_configs:
  screen: configs/fixed_final/256k.yaml
  cells_512: configs/fixed_final/512k.yaml
  cells_1m: configs/fixed_final/1m.yaml

activation_policy: >
  Regularizers start at densify_from (1000). Knobs taking an absolute step
  get 1000 (tv_start, voxel_var_start, neighbor_var_start, ref_volume_start);
  knobs supporting -1 keep -1, which already resolves to densify_from
  (top_eig_align_start, normal_lap_start, cvt_start).

decision_rule: >
  sigma_psnr, sigma_chamfer = sample sd over the five Stage-A BASE_s{42..46}
  replicates (256k, unmodified). An arm passes screening only if its delta
  versus the Stage-A mean exceeds 2*sigma in the favourable direction on
  volume PSNR OR Chamfer. Everything else -- including monotone-looking
  dose-response ladders -- is reported as noise. Arms whose activation
  marker is INACTIVE are reported as untested, never as a negative result.
  Stage-B screen arms run one replicate; Stage-C promotes a screen pass to a
  win only if the 3-replicate (seed 43/44/45) mean still clears 2*sigma.

damage_classes:
  bug_clean: >
    Training never touched a voxel grid -- supervision goes through the CUDA
    rasterizer. The model was fine; only the reported number was wrong. The
    verdict is unreliable so the arm is re-measured, but nothing was broken.
  bug_corrupted: >
    The misregistered grid entered the optimization target itself via
    align_corners=True. Exactly three families: FDK/volume density init
    (init_volume_path), the reference-volume loss (ref_volume_*), and
    reference-guided densification/pruning (ref_guided_*). For these the
    sweep produces the first valid measurement that has ever existed.

known_caveats:
  boundary_alignment: >
    boundary_align_weight / boundary_alignment_regularization were removed
    from the codebase; the 19-arm configs/boundary_sweep/ corpus is not
    re-testable as-is and is deliberately excluded. Surviving successors
    top_eig_align_weight (proposal A) and normal_lap_weight (proposal C) are
    tested instead; proposals B and D were never implemented.
  targeted_rays: >
    targeted_fraction weights cells by inverse cross-section (purely
    geometric); there was never a voxelized-reference-guided ray sampler.
    The "focus effort where it's hard" idea exists as high_error_fraction
    (rendered-error map) and, for densification, as ref_guided_densify.
  ablations_of_defaults: >
    The 256k screen baseline already has targeted_fraction 0.1,
    high_error_fraction 0.2, prune_variance_criterion True,
    grad_smooth_hops 1, redundancy_cap 0.05, and
    var_sigma_v_init/final 50.0/0.2. Several Stage-B arms below ablate an
    already-on default rather than activating a new mechanism.
  c2m_densify_until: >
    C2M sets densify_until: 7000 (not the stock 6000). Densification paces
    itself by next = max(100, (densify_factor-1)*N*(densify_until-
    densify_from)/(final_points-init_points)) and stops at 0.9*final_points.
    From init_points 64000 at densify_factor 1.15, reaching 0.9*2048000
    needs ~24 growth steps whose intervals sum to just over the default
    5000-iteration window, so the stock schedule would silently stall short
    of target. C2M has every regularizer off, so extending densify_until
    has no side effect on any regularizer schedule.
  cell_count_asymmetry: >
    configs/fixed_final/128k.yaml starts from init_points 32000 while
    256k/512k/1m start from 64000. The screen runs entirely at 256k so this
    does not affect it, and the CELLS ladder (C512/C1M/C2M) deliberately
    uses only the 64000-init configs.
  screen_budget: >
    Screening at 256k might miss cell-count-dependent effects; accepted
    deliberately to keep the screen affordable. Stage D re-tests the single
    best Stage-C survivor at 512k.

arms:
  # --- Stage A: baseline / noise floor (5 replicates, unmodified 256k) ---
  - {tag: BASE_s42, family: BASE, base: screen, overrides: {seed: 42}, assert_scalar: null, question: "Noise-floor replicate 1/5."}
  - {tag: BASE_s43, family: BASE, base: screen, overrides: {seed: 43}, assert_scalar: null, question: "Noise-floor replicate 2/5."}
  - {tag: BASE_s44, family: BASE, base: screen, overrides: {seed: 44}, assert_scalar: null, question: "Noise-floor replicate 3/5."}
  - {tag: BASE_s45, family: BASE, base: screen, overrides: {seed: 45}, assert_scalar: null, question: "Noise-floor replicate 4/5."}
  - {tag: BASE_s46, family: BASE, base: screen, overrides: {seed: 46}, assert_scalar: null, question: "Noise-floor replicate 5/5."}

  # --- Stage B: the screen (50 arms, one replicate each, base 256k) ---
  - {tag: TV_1e4, family: TV, base: screen, overrides: {tv_weight: 1.0e-4, tv_start: 1000}, assert_scalar: train/tv_loss, question: "Does adjacency TV at 1e-4 improve volume PSNR/chamfer?"}
  - {tag: TV_1e3, family: TV, base: screen, overrides: {tv_weight: 1.0e-3, tv_start: 1000}, assert_scalar: train/tv_loss, question: "Does adjacency TV at 1e-3 improve volume PSNR/chamfer?"}
  - {tag: TV_1e4_area, family: TV, base: screen, overrides: {tv_weight: 1.0e-4, tv_start: 1000, tv_area_weighted: True}, assert_scalar: train/tv_loss, question: "Does area-weighting TV help over plain TV at 1e-4?"}
  - {tag: TV_1e4_border, family: TV, base: screen, overrides: {tv_weight: 1.0e-4, tv_start: 1000, tv_border: True}, assert_scalar: train/tv_loss, question: "Does border-only TV help over plain TV at 1e-4?"}
  - {tag: NV_1e4, family: NV, base: screen, overrides: {neighbor_var_weight: 1.0e-4, neighbor_var_start: 1000}, assert_scalar: train/neighbor_var_loss, question: "Does neighbour-variance regularization at 1e-4 help?"}
  - {tag: NV_1e3, family: NV, base: screen, overrides: {neighbor_var_weight: 1.0e-3, neighbor_var_start: 1000}, assert_scalar: train/neighbor_var_loss, question: "Does neighbour-variance regularization at 1e-3 help?"}
  - {tag: NV_1e3_huber, family: NV, base: screen, overrides: {neighbor_var_weight: 1.0e-3, neighbor_var_start: 1000, neighbor_reg_type: bilateral_huber}, assert_scalar: train/neighbor_var_loss, question: "Does the Huber-robust variant beat plain bilateral_var at 1e-3?"}
  - {tag: NV_1e3_median, family: NV, base: screen, overrides: {neighbor_var_weight: 1.0e-3, neighbor_var_start: 1000, neighbor_reg_type: bilateral_median}, assert_scalar: train/neighbor_var_loss, question: "Does the median-robust variant beat plain bilateral_var at 1e-3?"}
  - {tag: NV_1e3_sharp, family: NV, base: screen, overrides: {neighbor_var_weight: 1.0e-3, neighbor_var_start: 1000, var_sigma_v_init: 0.2}, assert_scalar: train/neighbor_var_loss, question: "Does dropping the wide-to-narrow bilateral anneal (flat sigma_v=0.2) help?"}
  - {tag: VV_1e4, family: VV, base: screen, overrides: {voxel_var_weight: 1.0e-4, voxel_var_start: 1000}, assert_scalar: train/voxel_var_loss, question: "Does volume-based (informed) TV at 1e-4 help?"}
  - {tag: VV_1e3, family: VV, base: screen, overrides: {voxel_var_weight: 1.0e-3, voxel_var_start: 1000}, assert_scalar: train/voxel_var_loss, question: "Does volume-based TV at 1e-3 help?"}
  - {tag: VV_1e2, family: VV, base: screen, overrides: {voxel_var_weight: 1.0e-2, voxel_var_start: 1000}, assert_scalar: train/voxel_var_loss, question: "Does volume-based TV at 1e-2 help?"}
  - {tag: EIG_1e3, family: EIG, base: screen, overrides: {top_eig_align_weight: 1.0e-3, top_eig_align_start: -1}, assert_scalar: train/top_eig_align_loss, question: "Does top-eigenvector alignment (proposal A) at 1e-3 help?"}
  - {tag: EIG_1e2, family: EIG, base: screen, overrides: {top_eig_align_weight: 1.0e-2, top_eig_align_start: -1}, assert_scalar: train/top_eig_align_loss, question: "Does top-eigenvector alignment at 1e-2 help?"}
  - {tag: LAP_1e3, family: LAP, base: screen, overrides: {normal_lap_weight: 1.0e-3, normal_lap_start: -1}, assert_scalar: train/normal_lap_loss, question: "Does normal-Laplacian regularization (proposal C) at 1e-3 help?"}
  - {tag: LAP_1e2, family: LAP, base: screen, overrides: {normal_lap_weight: 1.0e-2, normal_lap_start: -1}, assert_scalar: train/normal_lap_loss, question: "Does normal-Laplacian regularization at 1e-2 help?"}
  - {tag: CVT_1e3, family: CVT, base: screen, overrides: {cvt_weight: 1.0e-3, cvt_start: -1}, assert_scalar: train/cvt_loss, question: "Does CVT/Lloyd sliver-pull regularization at 1e-3 help?"}
  - {tag: CVT_1e2, family: CVT, base: screen, overrides: {cvt_weight: 1.0e-2, cvt_start: -1}, assert_scalar: train/cvt_loss, question: "Does CVT/Lloyd sliver-pull regularization at 1e-2 help?"}
