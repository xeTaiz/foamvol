  - {tag: D_bins12, family: DENS, base: screen, overrides: {entropy_bins: 12}, assert_scalar: null, question: "Does refining entropy_bins to 12 (from default 5) help?"}
  - {tag: D_ca1, family: DENS, base: screen, overrides: {contrast_alpha: 1.0}, assert_scalar: null, question: "Does contrast-weighted projection loss at alpha=1 help?"}
  - {tag: D_ca4, family: DENS, base: screen, overrides: {contrast_alpha: 4.0}, assert_scalar: null, question: "Does contrast-weighted projection loss at alpha=4 help?"}
  - {tag: D_thr500, family: DENS, base: screen, overrides: {densify_grad_thresh: 500, gradient_fraction: 1.0, idw_fraction: 0.0, entropy_fraction: 0.0}, assert_scalar: null, question: "Does gradient-threshold densification (thresh=500) beat the fixed-fraction budget?"}
  - {tag: D_thr1000, family: DENS, base: screen, overrides: {densify_grad_thresh: 1000, gradient_fraction: 1.0, idw_fraction: 0.0, entropy_fraction: 0.0}, assert_scalar: null, question: "Does gradient-threshold densification (thresh=1000) beat the fixed-fraction budget?"}
  - {tag: D_thr1000_v5e3, family: DENS, base: screen, overrides: {densify_grad_thresh: 1000, gradient_fraction: 1.0, idw_fraction: 0.0, entropy_fraction: 0.0, densify_var_thresh: 5.0e-3}, assert_scalar: null, question: "Does adding the variance AND-gate to the thresh=1000 arm help?"}
  - {tag: P_idw, family: PRUNE, base: screen, overrides: {prune_variance_criterion: False}, assert_scalar: null, question: "Does reverting to IDW-based pruning (from the default variance criterion) change the result?"}
  - {tag: P_cap03, family: PRUNE, base: screen, overrides: {redundancy_cap: 0.03}, assert_scalar: null, question: "Does tightening redundancy_cap to 0.03 (from default 0.05) help?"}
  - {tag: P_cap10, family: PRUNE, base: screen, overrides: {redundancy_cap: 0.10}, assert_scalar: null, question: "Does loosening redundancy_cap to 0.10 (from default 0.05) help?"}
  - {tag: P_hops2, family: PRUNE, base: screen, overrides: {prune_hops: 2}, assert_scalar: null, question: "Does widening the pruning neighborhood to 2 hops help?"}
  - {tag: S_tgt0, family: SAMPLE, base: screen, overrides: {targeted_fraction: 0.0}, assert_scalar: null, question: "Does disabling targeted (inverse cross-section) ray sampling change the result?"}
  - {tag: S_tgt30, family: SAMPLE, base: screen, overrides: {targeted_fraction: 0.3}, assert_scalar: null, question: "Does raising targeted-ray fraction to 0.3 (from default 0.1) help?"}
  - {tag: S_he0, family: SAMPLE, base: screen, overrides: {high_error_fraction: 0.0}, assert_scalar: null, question: "Does disabling high-error ray resampling change the result?"}
  - {tag: S_he40, family: SAMPLE, base: screen, overrides: {high_error_fraction: 0.4}, assert_scalar: null, question: "Does raising high-error fraction to 0.4 (from default 0.2) help?"}
  - {tag: S_he_p2, family: SAMPLE, base: screen, overrides: {high_error_power: 2.0}, assert_scalar: null, question: "Does quadratic high-error weighting (power=2) beat linear (power=1)?"}
  - {tag: BF_dens, family: BF, base: screen, overrides: {bf_start: 1000, bf_until: 6000, bf_period: 10}, assert_scalar: null, question: "Does bilateral density filtering during densification (1000-6000) help?"}
  - {tag: BF_late, family: BF, base: screen, overrides: {bf_start: 6000, bf_until: 9000, bf_period: 10}, assert_scalar: null, question: "Does bilateral density filtering post-densification (6000-9000) help?"}
  - {tag: REF_1e3, family: REF, base: screen, overrides: {ref_volume_path: __REF_NPY__, ref_volume_weight: 1.0e-3, ref_volume_start: 1000}, assert_scalar: train/ref_vol_loss, question: "Bug-corrupted family, first valid measurement: does a reference-volume loss at 1e-3 help?"}
  - {tag: REF_1e2, family: REF, base: screen, overrides: {ref_volume_path: __REF_NPY__, ref_volume_weight: 1.0e-2, ref_volume_start: 1000}, assert_scalar: train/ref_vol_loss, question: "Bug-corrupted family, first valid measurement: does a reference-volume loss at 1e-2 help?"}
