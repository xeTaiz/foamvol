  - {tag: C512, family: CELLS, base: cells_512, overrides: {}, assert_scalar: null, question: "Cell-count ceiling: does 512k final points beat 256k?"}
  - {tag: C1M, family: CELLS, base: cells_1m, overrides: {}, assert_scalar: null, question: "Cell-count ceiling: does 1M final points beat 512k?"}
